<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>IOI 2026 UZ — Mehmonxona Navigatori & Volontyor Tizimi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-canvas: #f8fafc;
  --surface: #ffffff;
  --ink: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;

  --accent: #10b981;
  --accent-dark: #047857;
  --accent-soft: #d1fae5;

  --indigo: #4f46e5;
  --indigo-dark: #3730a3;
  --indigo-soft: #e0e7ff;

  --amber: #f59e0b;
  --amber-soft: #fef3c7;

  --red: #ef4444;
  --red-soft: #fee2e2;

  --blue: #3b82f6;
  --blue-soft: #dbeafe;

  --purple: #8b5cf6;
  --purple-soft: #ede9fe;

  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 30px -8px rgba(15, 23, 42, 0.12), 0 8px 12px -6px rgba(15, 23, 42, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-canvas);
  background-image: 
    radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.04) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
  padding: 24px 16px 60px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1200px; margin: 0 auto; }

/* Topbar Header */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  background: var(--surface);
  padding: 16px 22px;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--indigo) 0%, #312e81 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-weight: 800; color: #fff; font-size: 15px;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}
.brand h1 {
  font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;
  letter-spacing: -0.02em; color: var(--ink);
}
.brand p { font-size: 13px; color: var(--ink-soft); margin-top: 1px; }

.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.roletabs {
  display: flex; background: #f1f5f9; border: 1px solid var(--line);
  border-radius: 14px; padding: 4px; gap: 4px;
}
.roletabs button {
  border: none; background: transparent; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
  color: var(--ink-soft); padding: 9px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.roletabs button:hover { color: var(--ink); }
.roletabs button.active {
  background: var(--ink); color: #fff; box-shadow: var(--shadow-sm);
}

.devicetoggle {
  display: flex; background: #f1f5f9; border: 1px solid var(--line);
  border-radius: 14px; padding: 4px; gap: 4px;
}
.devicetoggle button {
  border: none; background: transparent; font-weight: 600; font-size: 13px; color: var(--ink-soft);
  padding: 9px 14px; border-radius: 10px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.devicetoggle button.active {
  background: var(--surface); color: var(--indigo); box-shadow: var(--shadow-sm);
}

.role-note {
  font-size: 13px; line-height: 1.5; color: var(--ink-soft); background: var(--surface);
  border: 1px solid var(--line); border-left: 4px solid var(--indigo);
  border-radius: 14px; padding: 12px 18px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.role-note b { color: var(--ink); }

/* Stage & Device Containers */
.stage { display: flex; justify-content: center; }

.phone {
  width: 390px; background: #0f172a; border-radius: 46px; padding: 12px;
  box-shadow: 0 30px 70px -15px rgba(15, 23, 42, 0.4), 0 0 0 10px #1e293b;
  position: relative; transition: all 0.3s ease;
}
.phone-screen {
  background: var(--bg-canvas); border-radius: 36px; overflow: hidden; min-height: 750px;
  display: flex; flex-direction: column; position: relative;
}
.phone-notch {
  height: 28px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-canvas); z-index: 10;
}
.phone-notch::before { content: ''; width: 96px; height: 18px; background: #0f172a; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }

.desktopwin {
  width: 100%; max-width: 1120px; background: var(--surface); border-radius: 20px; overflow: hidden;
  border: 1px solid var(--line); box-shadow: var(--shadow-lg); transition: all 0.3s ease;
}
.winbar {
  background: #f1f5f9; padding: 12px 18px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--line);
}
.winbar span { width: 11px; height: 11px; border-radius: 50%; }
.winbar span:nth-child(1) { background: #ef4444; }
.winbar span:nth-child(2) { background: #f59e0b; }
.winbar span:nth-child(3) { background: #10b981; }
.desktop-body { padding: 32px; min-height: 680px; }

/* Shared UI Components */
.appbar { padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(226, 232, 240, 0.7); }
.appbar .who { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink); }
.appbar .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--indigo-soft); color: var(--indigo-dark);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  font-family: 'JetBrains Mono', monospace; border: 2px solid var(--surface); box-shadow: var(--shadow-sm);
}

.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 100px; color: #fff; transition: transform 0.15s ease;
}
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0.9; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
  box-shadow: var(--shadow-sm); transition: all 0.2s ease;
}
.card:hover { border-color: var(--line-strong); }

.search {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; font-size: 13.5px; color: var(--ink);
  box-shadow: var(--shadow-sm); transition: all 0.2s ease;
}
.search:focus-within { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
.search input { border: none; outline: none; background: transparent; width: 100%; font-family: inherit; font-size: 13.5px; color: var(--ink); }
.search input::placeholder { color: var(--ink-faint); }

/* Ticket Card */
.ticket {
  background: var(--surface); border-radius: 20px; position: relative; overflow: hidden;
  border: 1px solid var(--line); box-shadow: var(--shadow-md); transition: all 0.25s ease;
}
.ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.ticket-top { padding: 20px 20px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
.ticket-top .country { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.ticket-top .name { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-top: 4px; color: var(--ink); }
.ticket-top .role-badge {
  font-size: 11px; font-weight: 700; background: var(--indigo-soft); color: var(--indigo-dark);
  padding: 5px 12px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em;
}
.perf { position: relative; height: 0; z-index: 2; }
.perf::before {
  content: ''; position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg-canvas);
  border-right: 1px solid var(--line);
}
.perf::after {
  content: ''; position: absolute; right: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg-canvas);
  border-left: 1px solid var(--line);
}
.dash { border-top: 2px dashed var(--line); margin: 0 20px; }
.ticket-bottom { padding: 18px 20px 22px; display: flex; gap: 16px; background: #fafafa; }
.tb-block { flex: 1; }
.tb-label { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.tb-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--ink); }
.tb-value.small { font-size: 16px; font-weight: 600; }
.tb-hotel { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

.route-btn {
  width: calc(100% - 36px); margin: 0 18px 18px; background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
  color: #fff; border: none; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35); transition: all 0.2s ease;
}
.route-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45); }

.action-btn-group {
  display: flex; gap: 10px; padding: 0 18px 16px;
}
.btn-secondary {
  flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 13px; color: var(--ink); display: flex; align-items: center; justify-content: center;
  gap: 8px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
}
.btn-secondary:hover { background: #f8fafc; border-color: var(--indigo); color: var(--indigo); }

.mini-map {
  height: 160px; border-radius: 16px; background:
    linear-gradient(135deg, #e2e8f0 25%, transparent 25%) -10px 0/20px 20px,
    linear-gradient(225deg, #e2e8f0 25%, transparent 25%) -10px 0/20px 20px,
    #f1f5f9;
  border: 1px solid var(--line); position: relative; overflow: hidden;
}
.mini-map .pin {
  position: absolute; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; background: var(--red);
  transform: rotate(-45deg); left: 55%; top: 35%; box-shadow: 0 6px 12px rgba(239, 68, 68, 0.4);
  animation: pulsePin 2s infinite;
}
@keyframes pulsePin {
  0%, 100% { transform: rotate(-45deg) scale(1); }
  50% { transform: rotate(-45deg) scale(1.1); }
}
.mini-map .pin::after { content: ''; width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; top: 6px; left: 6px; }
.mini-map .youarehere {
  position: absolute; left: 16%; bottom: 16%; font-size: 11px; font-weight: 700;
  background: var(--ink); color: #fff; padding: 4px 10px; border-radius: 100px; box-shadow: var(--shadow-sm);
}

.roommate-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.roommate-row:first-child { border-top: none; padding-top: 4px; }
.rm-av {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-dark);
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace;
}
.rm-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.rm-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }

/* Volunteer View Specific Styling */
.vol-banner {
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
  color: #fff; border-radius: 16px; padding: 16px; margin: 0 18px 14px;
  box-shadow: 0 8px 20px rgba(49, 46, 129, 0.2); display: flex; align-items: center; justify-content: space-between;
}
.vol-banner .title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a5b4fc; }
.vol-banner .name { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin-top: 2px; color: #fff; }
.vol-banner .badge-country {
  background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 100px;
  font-size: 12.5px; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 6px;
}

.filter-btn {
  display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
  cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s ease; position: relative; white-space: nowrap;
}
.filter-btn:hover { background: #f8fafc; border-color: var(--indigo); color: var(--indigo); }
.filter-btn.active { background: var(--indigo-soft); border-color: var(--indigo); color: var(--indigo-dark); font-weight: 700; }
.filter-btn .filter-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--indigo); position: absolute; top: 6px; right: 6px;
}

.filter-accordion-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; margin: 0 18px 14px; box-shadow: var(--shadow-sm);
  animation: slideDown 0.25s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.filterrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filterrow::-webkit-scrollbar { display: none; }
.filterrow .chip.outline { background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; cursor: pointer; transition: all 0.2s; }
.filterrow .chip.outline::before { display: none; }
.filterrow .chip.outline.on { background: var(--indigo); color: #fff; border-color: var(--indigo); font-weight: 700; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3); }

.member-card {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line);
  cursor: pointer; transition: all 0.2s ease; background: var(--surface); border-radius: 14px; margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.member-card:hover { transform: translateY(-2px); border-color: var(--indigo); box-shadow: var(--shadow-md); background: #fafafa; }
.member-card:last-child { margin-bottom: 0; }
.m-avatar {
  width: 42px; height: 42px; border-radius: 12px; background: var(--indigo-soft); color: var(--indigo-dark);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
}
.m-info { flex: 1; min-width: 0; }
.m-info .name { font-size: 14.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; justify-content: space-between; }
.m-info .sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; display: flex; align-items: center; gap: 8px; }
.status-pill {
  font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 100px;
}
.status-pill.checked { background: var(--accent-soft); color: var(--accent-dark); }
.status-pill.arriving { background: var(--amber-soft); color: #b45309; }

.back-btn-header {
  display: flex; align-items: center; gap: 8px; padding: 12px 18px; font-size: 13.5px; font-weight: 700;
  color: var(--indigo); cursor: pointer; transition: color 0.15s; background: transparent; border: none;
}
.back-btn-header:hover { color: var(--indigo-dark); }

/* Organizer Layout */
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.statcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-sm); }
.statcard .n { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: var(--ink); }
.statcard .l { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.statcard.warn { background: var(--red-soft); border-color: #fca5a5; }
.statcard.warn .n { color: var(--red); }

.hotelbar-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
.hb-label { width: 110px; font-size: 13px; font-weight: 600; flex: none; color: var(--ink); }
.hb-track { flex: 1; height: 10px; background: #e2e8f0; border-radius: 100px; overflow: hidden; position: relative; }
.hb-fill { height: 100%; border-radius: 100px; transition: width 0.4s ease; }
.hb-num { width: 78px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); flex: none; font-weight: 600; }

.alertline { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.alertline:first-child { border-top: none; }
.alertdot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; }
.alertline .at { font-size: 13px; font-weight: 600; color: var(--ink); }
.alertline .as { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

.floorplan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
.room { padding: 10px 8px; border-radius: 10px; text-align: center; color: #fff; box-shadow: var(--shadow-sm); }
.room.std { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); }
.room.dlx { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
.room.suite { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); }
.room.stair { background: #cbd5e1; color: var(--ink-soft); }
.room .code { display: block; font-size: 12px; margin-top: 3px; }

.twocol { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; }
.section-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; color: var(--ink); }
.section-title span.tag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: var(--ink-faint); background: #f1f5f9; padding: 3px 8px; border-radius: 6px; }

@media (max-width: 1040px) {
  .stage { overflow-x: auto; }
  .twocol { grid-template-columns: 1fr; }
  .statgrid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

// Event Listeners
document.getElementById('roletabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#roletabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.role = b.dataset.role;
  state.selectedMemberId = null; // reset sub-page view when role changes
  render();
});

document.getElementById('devicetoggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#devicetoggle button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.device = b.dataset.device;
  render();
});

// Helper: Find member by ID
function findMemberById(id) {
  for (let key in dataStore.delegations) {
    const found = dataStore.delegations[key].members.find(m => m.id === id);
    if (found) return found;
  }
  return dataStore.delegations.kz.members[0]; // fallback
}

// Main Render Function
function render() {
  document.getElementById('rolenote').innerHTML = notes[state.role];
  const stage = document.getElementById('stage');

  if (state.device === 'mobile') {
    let inner = state.role === 'delegate' ? delegateContent() : state.role === 'volunteer' ? volunteerContent() : organizerMobile();
    stage.innerHTML = `
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <div style="display:flex; flex-direction:column; flex:1;">${inner}</div>
        </div>
      </div>`;
  } else {
    let inner = state.role === 'delegate' ? delegateDesktop() : state.role === 'volunteer' ? volunteerDesktop() : organizerDesktop();
    stage.innerHTML = `
      <div class="desktopwin">
        <div class="winbar"><span></span><span></span><span></span></div>
        <div class="desktop-body">${inner}</div>
      </div>`;
  }
}

render();
