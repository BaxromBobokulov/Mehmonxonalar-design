<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>IOI 2026 UZ — Mehmonxona Navigatori</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#F2F4F7;
  --surface:#FFFFFF;
  --ink:#12141C;
  --ink-soft:#5B6072;
  --ink-faint:#9298A8;
  --line:#E3E6EC;
  --accent:#16A34A;
  --accent-dark:#0E7A37;
  --accent-soft:#E7F7ED;
  --indigo:#3733A6;
  --indigo-soft:#ECEBFA;
  --amber:#F59E0B;
  --amber-soft:#FEF3DA;
  --red:#E5484D;
  --red-soft:#FCE7E8;

  --navoi:#2563EB; --buxoro:#7C3AED; --fargona:#0D9488; --andijon:#DB2777;
  --namangan:#EA580C; --sirdaryo:#059669; --jizzax:#B45309; --xorazm:#4F46E5;
  --qoraqalpaq:#0284C7; --kashkadaryo:#A16207; --surxondaryo:#65A30D; --yangitosh:#9333EA;
}

*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  padding:32px 16px 80px;
  min-height:100vh;
}
.wrap{max-width:1180px; margin:0 auto;}

/* ---------- HEADER / CONTROLS ---------- */
.topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:40px; height:40px; border-radius:10px; background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; color:#fff; font-size:14px;
}
.brand h1{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.01em;}
.brand p{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}

.controls{display:flex; gap:10px; flex-wrap:wrap;}
.roletabs{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; gap:2px;}
.roletabs button{
  border:none; background:transparent; font-family:'Inter'; font-weight:600; font-size:13px;
  color:var(--ink-soft); padding:9px 16px; border-radius:9px; cursor:pointer; transition:.15s;
}
.roletabs button.active{background:var(--ink); color:#fff;}
.devicetoggle{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; gap:2px;}
.devicetoggle button{
  border:none; background:transparent; font-weight:600; font-size:13px; color:var(--ink-soft);
  padding:9px 14px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.devicetoggle button.active{background:var(--accent-soft); color:var(--accent-dark);}

.role-note{
  font-size:12.5px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:10px 14px; margin-bottom:24px; max-width:720px;
}
.role-note b{color:var(--ink);}

/* ---------- FRAMES ---------- */
.stage{display:flex; justify-content:center;}
.phone{
  width:375px; background:var(--ink); border-radius:38px; padding:12px;
  box-shadow:0 24px 60px -20px rgba(18,20,28,.35);
}
.phone-screen{
  background:var(--bg); border-radius:28px; overflow:hidden; min-height:720px;
  display:flex; flex-direction:column;
}
.phone-notch{height:26px; display:flex; align-items:center; justify-content:center;}
.phone-notch::before{content:''; width:90px; height:6px; background:#000; border-radius:6px;}

.desktopwin{
  width:100%; max-width:1080px; background:var(--surface); border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:0 24px 60px -24px rgba(18,20,28,.25);
}
.winbar{background:#EAEDF2; padding:10px 16px; display:flex; align-items:center; gap:8px;}
.winbar span{width:10px; height:10px; border-radius:50%; background:#D3D7DE;}
.desktop-body{padding:28px 32px; min-height:640px;}

/* ---------- SHARED UI BITS ---------- */
.appbar{padding:18px 18px 14px; display:flex; align-items:center; justify-content:space-between;}
.appbar .who{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
.appbar .sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--indigo-soft); color:var(--indigo);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:'JetBrains Mono';}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:4px 9px; border-radius:100px; color:#fff;
}
.chip::before{content:''; width:6px; height:6px; border-radius:50%; background:#fff; opacity:.85;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px;}

.search{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:11px 14px; font-size:13.5px; color:var(--ink-faint);
}
.search svg{flex:none;}

/* ---------- DELEGATE: TICKET ---------- */
.ticket{
  background:var(--surface); border-radius:18px; position:relative; overflow:hidden;
  border:1px solid var(--line);
}
.ticket-top{padding:18px 18px 16px; display:flex; justify-content:space-between; align-items:flex-start;}
.ticket-top .country{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
.ticket-top .name{font-family:'Space Grotesk'; font-size:19px; font-weight:700; margin-top:3px;}
.ticket-top .role-badge{
  font-size:10.5px; font-weight:700; background:var(--indigo-soft); color:var(--indigo);
  padding:4px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.04em;
}
.perf{position:relative; height:0;}
.perf::before{
  content:''; position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);
}
.perf::after{
  content:''; position:absolute; right:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);
}
.dash{border-top:2px dashed var(--line); margin:0 18px;}
.ticket-bottom{padding:16px 18px 20px; display:flex; gap:14px;}
.tb-block{flex:1;}
.tb-label{font-size:10px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px;}
.tb-value{font-family:'JetBrains Mono'; font-size:20px; font-weight:700;}
.tb-value.small{font-size:15px;}
.tb-hotel{display:flex; align-items:center; gap:8px; margin-top:2px;}

.route-btn{
  margin:0 18px 18px; background:var(--accent); color:#fff; border:none; border-radius:12px;
  padding:13px; font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}

.mini-map{
  height:150px; border-radius:14px; background:
    linear-gradient(135deg, #EEF1F5 25%, transparent 25%) -8px 0/16px 16px,
    linear-gradient(225deg, #EEF1F5 25%, transparent 25%) -8px 0/16px 16px,
    #F7F8FA;
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.mini-map .pin{
  position:absolute; width:26px; height:26px; border-radius:50% 50% 50% 0; background:var(--red);
  transform:rotate(-45deg); left:58%; top:38%; box-shadow:0 4px 10px rgba(229,72,77,.4);
}
.mini-map .pin::after{content:''; width:9px; height:9px; background:#fff; border-radius:50%; position:absolute; top:6px; left:6px;}
.mini-map .youarehere{position:absolute; left:16%; bottom:18%; font-size:10px; font-weight:700; background:var(--ink); color:#fff; padding:3px 8px; border-radius:100px;}

.roommate-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
.roommate-row:first-child{border-top:none;}
.rm-av{width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono';}
.rm-name{font-size:13px; font-weight:600;}
.rm-sub{font-size:11px; color:var(--ink-soft);}

/* ---------- VOLUNTEER ---------- */
.filterrow{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px;}
.filterrow .chip.outline{background:transparent; border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;}
.filterrow .chip.outline::before{display:none;}
.filterrow .chip.outline.on{background:var(--ink); color:#fff; border-color:var(--ink);}

.deleg-row{display:flex; align-items:center; gap:12px; padding:13px; border-bottom:1px solid var(--line); cursor:pointer;}
.deleg-row:last-child{border-bottom:none;}
.flag{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--indigo-soft);}
.deleg-main{flex:1; min-width:0;}
.deleg-main .t{font-size:13.5px; font-weight:700;}
.deleg-main .s{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.count-badge{font-family:'JetBrains Mono'; font-size:11px; font-weight:700; color:var(--ink-soft); background:var(--bg); padding:4px 8px; border-radius:8px;}

/* ---------- ORGANIZER ---------- */
.statgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.statcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px;}
.statcard .n{font-family:'Space Grotesk'; font-size:24px; font-weight:700;}
.statcard .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.statcard.warn{background:var(--red-soft); border-color:#F6C7C9;}
.statcard.warn .n{color:var(--red);}

.hotelbar-row{display:flex; align-items:center; gap:12px; padding:11px 0;}
.hb-label{width:120px; font-size:12.5px; font-weight:600; flex:none;}
.hb-track{flex:1; height:10px; background:var(--bg); border-radius:100px; overflow:hidden; position:relative;}
.hb-fill{height:100%; border-radius:100px;}
.hb-num{width:74px; text-align:right; font-family:'JetBrains Mono'; font-size:11.5px; color:var(--ink-soft); flex:none;}

.alertline{display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line);}
.alertline:first-child{border-top:none;}
.alertdot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none;}
.alertline .at{font-size:12.5px; font-weight:600;}
.alertline .as{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

.floorplan{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; font-family:'JetBrains Mono'; font-size:11px; font-weight:700;}
.room{padding:8px 6px; border-radius:8px; text-align:center; color:#fff;}
.room.std{background:#EAB308;}
.room.dlx{background:#0EA5E9;}
.room.suite{background:#EC4899;}
.room.stair{background:#CBD1DB; color:var(--ink-soft);}
.room .code{display:block; font-size:12px; margin-top:2px;}

.twocol{display:grid; grid-template-columns:1.15fr .85fr; gap:24px;}
.section-title{font-family:'Space Grotesk'; font-weight:700; font-size:14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
.section-title span.tag{font-family:'Inter'; font-size:11px; font-weight:600; color:var(--ink-faint);}

@media (max-width:1040px){
  .stage{overflow-x:auto;}
  .twocol{grid-template-columns:1fr;}
  .statgrid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">IOI</div>
      <div>
        <h1>Mehmonxona Navigatori</h1>
        <p>IOI 2026 · O'zbekiston — dizayn maketi</p>
      </div>
    </div>
    <div class="controls">
      <div class="roletabs" id="roletabs">
        <button data-role="delegate" class="active">Delegatsiya</button>
        <button data-role="volunteer">Volontyor</button>
        <button data-role="organizer">Tashkilotchi</button>
      </div>
      <div class="devicetoggle" id="devicetoggle">
        <button data-device="mobile" class="active">📱 Mobil</button>
        <button data-device="desktop">🖥 Desktop</button>
      </div>
    </div>
  </div>

  <div class="role-note" id="rolenote"></div>

  <div class="stage" id="stage"></div>

</div>

<script>
const notes = {
  delegate: "<b>Delegatsiya a'zosi:</b> yagona vazifa — o'z xonasini imkon qadar tez topish. Qidiruvsiz, bitta ism kiritilgach natija 'chipta' ko'rinishida chiqadi: mehmonxona, qavat, xona raqami va u yergacha yo'nalish.",
  volunteer: "<b>Volontyor:</b> o'z delegatsiyasini va uning a'zolarini tezda topish, kontakt va joylashuvni ko'rish uchun mo'ljallangan ro'yxat + xarita ko'rinishi.",
  organizer: "<b>Tashkilotchi:</b> barcha mehmonxonalar bo'yicha umumiy nazorat — bandlik, sig'im ogohlantirishlari (masalan −110 o'rin taqchilligi) va konflikt-juftliklar (mamlakatlar ajratilishi) monitoringi."
};

let state = {role:'delegate', device:'mobile'};

document.getElementById('roletabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#roletabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.role = b.dataset.role; render();
});
document.getElementById('devicetoggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#devicetoggle button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.device = b.dataset.device; render();
});

// ---------- content blocks ----------

function delegateContent(){
  return `
  <div class="appbar">
    <div><div class="who">Assalomu alaykum, Aruzhan</div><div class="sub">Qozog'iston delegatsiyasi · Contestant</div></div>
    <div class="avatar">AR</div>
  </div>
  <div style="padding:0 18px 16px;">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg>Familiya yoki ID bo'yicha qidirish...</div>
  </div>
  <div style="padding:0 18px 14px;">
    <div class="ticket">
      <div class="ticket-top">
        <div><div class="country">Qozog'iston 🇰🇿</div><div class="name">Aruzhan Bekova</div></div>
        <div class="role-badge">Contestant</div>
      </div>
      <div class="perf"></div><div class="dash"></div>
      <div class="ticket-bottom">
        <div class="tb-block">
          <div class="tb-label">Mehmonxona</div>
          <div class="tb-hotel"><span class="chip" style="background:var(--fargona)">Farg'ona</span></div>
        </div>
        <div class="tb-block">
          <div class="tb-label">Qavat / Xona</div>
          <div class="tb-value">3 · 305</div>
        </div>
        <div class="tb-block" style="flex:.7">
          <div class="tb-label">Turi</div>
          <div class="tb-value small">STD</div>
        </div>
      </div>
    </div>
  </div>
  <div style="padding:0 18px 14px;">
    <div class="mini-map"><div class="pin"></div><div class="youarehere">Siz shu yerdasiz</div></div>
  </div>
  <button class="route-btn">Yo'nalishni ko'rsatish
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
  <div style="padding:0 18px 22px; flex:1;">
    <div class="card">
      <div class="section-title" style="margin-bottom:6px;">Xonadoshlaringiz <span class="tag">305-xona</span></div>
      <div class="roommate-row"><div class="rm-av">DN</div><div><div class="rm-name">Dina Nurlanovna</div><div class="rm-sub">Qozog'iston · Contestant</div></div></div>
      <div class="roommate-row"><div class="rm-av">SK</div><div><div class="rm-name">Saltanat K.</div><div class="rm-sub">Qozog'iston · Contestant</div></div></div>
    </div>
  </div>`;
}

function volunteerContent(){
  const rows = [
    {flag:'🇰🇿',name:"Qozog'iston",sub:"Farg'ona · 80/9 · 6 a'zo",n:6,c:'var(--fargona)'},
    {flag:'🇮🇳',name:"Hindiston",sub:"Andijon · 80/10 · 8 a'zo",n:8,c:'var(--andijon)'},
    {flag:'🇺🇿',name:"O'zbekiston (host)",sub:"Xorazm · 80/16 · 12 a'zo",n:12,c:'var(--xorazm)'},
    {flag:'🇯🇵',name:"Yaponiya",sub:"Qoraqalpaqston · 80/15 · 5 a'zo",n:5,c:'var(--qoraqalpaq)'},
    {flag:'🇺🇸',name:"AQSH",sub:"Kashkadaryo · 5 a'zo",n:5,c:'var(--kashkadaryo)'},
    {flag:'🇮🇷',name:"Eron",sub:"Sirdaryo · 80/6 · 5 a'zo",n:5,c:'var(--sirdaryo)'},
  ];
  return `
  <div class="appbar">
    <div><div class="who">Volontyor paneli</div><div class="sub">Sektor: G'arbiy blok · 24 ta delegatsiya</div></div>
    <div class="avatar" style="background:var(--accent-soft); color:var(--accent-dark);">VL</div>
  </div>
  <div style="padding:0 18px 10px;">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg>Delegatsiya yoki mamlakat qidirish...</div>
  </div>
  <div style="padding:0 18px 8px;">
    <div class="filterrow">
      <div class="chip outline on">Barchasi</div>
      <div class="chip outline">Farg'ona</div>
      <div class="chip outline">Andijon</div>
      <div class="chip outline">Xorazm</div>
      <div class="chip outline">Namangan</div>
    </div>
  </div>
  <div style="padding:0 18px; flex:1;">
    <div class="card" style="padding:4px 12px;">
      ${rows.map(r=>`
        <div class="deleg-row">
          <div class="flag">${r.flag}</div>
          <div class="deleg-main"><div class="t">${r.name}</div><div class="s">${r.sub}</div></div>
          <span class="chip" style="background:${r.c}">${r.n}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function organizerMobile(){
  return `
  <div class="appbar">
    <div><div class="who">Boshqaruv paneli</div><div class="sub">IOI 2026 · Jonli holat</div></div>
    <div class="avatar" style="background:var(--indigo-soft); color:var(--indigo);">TZ</div>
  </div>
  <div style="padding:0 18px;">
    <div class="statgrid" style="grid-template-columns:1fr 1fr;">
      <div class="statcard"><div class="n">668</div><div class="l">Jami ishtirokchi</div></div>
      <div class="statcard"><div class="n">9</div><div class="l">Mehmonxonalar</div></div>
      <div class="statcard warn"><div class="n">−110</div><div class="l">O'rin taqchilligi</div></div>
      <div class="statcard"><div class="n">95</div><div class="l">Mamlakatlar</div></div>
    </div>
  </div>
  <div style="padding:16px 18px;">
    <div class="card">
      <div class="section-title">Ogohlantirishlar <span class="tag">3 ta faol</span></div>
      <div class="alertline"><div class="alertdot" style="background:var(--red);"></div><div><div class="at">Farg'ona mehmonxonasi — sig'im oshib ketgan</div><div class="as">112/98 o'rin band qilingan</div></div></div>
      <div class="alertline"><div class="alertdot" style="background:var(--amber);"></div><div><div class="at">AQSH / Eron — bir binoda</div><div class="as">Konflikt-juftlik qoidasi tekshiruvi kerak</div></div></div>
      <div class="alertline"><div class="alertdot" style="background:var(--amber);"></div><div><div class="at">Jinsi bo'yicha ajratish — Sirdaryo</div><div class="as">2 ta xonada aralash taqsimot topildi</div></div></div>
    </div>
  </div>
  <div style="padding:0 18px 22px; flex:1;">
    <div class="card">
      <div class="section-title">Mehmonxonalar bandligi</div>
      <div class="hotelbar-row"><div class="hb-label">Farg'ona</div><div class="hb-track"><div class="hb-fill" style="width:100%; background:var(--red);"></div></div><div class="hb-num">112/98</div></div>
      <div class="hotelbar-row"><div class="hb-label">Xorazm</div><div class="hb-track"><div class="hb-fill" style="width:88%; background:var(--accent);"></div></div><div class="hb-num">86/98</div></div>
      <div class="hotelbar-row"><div class="hb-label">Andijon</div><div class="hb-track"><div class="hb-fill" style="width:74%; background:var(--accent);"></div></div><div class="hb-num">72/98</div></div>
      <div class="hotelbar-row"><div class="hb-label">Namangan</div><div class="hb-track"><div class="hb-fill" style="width:61%; background:var(--accent);"></div></div><div class="hb-num">60/98</div></div>
    </div>
  </div>`;
}

function organizerDesktop(){
  return `
  <div class="section-title" style="font-size:17px; margin-bottom:20px;">Boshqaruv paneli — jonli holat</div>
  <div class="statgrid" style="margin-bottom:24px;">
    <div class="statcard"><div class="n">668</div><div class="l">Jami ishtirokchi</div></div>
    <div class="statcard"><div class="n">9</div><div class="l">Mehmonxonalar</div></div>
    <div class="statcard warn"><div class="n">−110</div><div class="l">O'rin taqchilligi</div></div>
    <div class="statcard"><div class="n">95</div><div class="l">Mamlakatlar</div></div>
  </div>
  <div class="twocol">
    <div>

function render(){
  document.getElementById('rolenote').innerHTML = notes[state.role];
  const stage = document.getElementById('stage');

  if(state.device==='mobile'){
    let inner = state.role==='delegate' ? delegateContent() : state.role==='volunteer' ? volunteerContent() : organizerMobile();
    stage.innerHTML = `
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <div style="display:flex; flex-direction:column; flex:1;">${inner}</div>
        </div>
      </div>`;
  } else {
    let inner = state.role==='delegate' ? delegateDesktop() : state.role==='volunteer' ? volunteerDesktop() : organizerDesktop();
    stage.innerHTML = `
      <div class="desktopwin">
        <div class="winbar"><span></span><span></span><span></span></div>
        <div class="desktop-body">${inner}</div>
      </div>`;
  }
}
render();
